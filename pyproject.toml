[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pccpy"
version = "0.17.0"
description = "Control Estadístico de Procesos (SPC) en Python: cartas de control, capacidad y pruebas al estilo Minitab"
readme = "README.md"
requires-python = ">=3.9"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "LeoSanta15", email = "angelsanta1@gmail.com" }
]
keywords = ["spc", "control estadístico de procesos", "cartas de control", "gráficas de control", "capacidad de proceso",
            "cpk", "ewma", "cusum", "minitab", "six sigma", "python", "statistical process control"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.4",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.10", "babel>=2.12"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2", "myst-parser>=2", "sphinx-intl>=2.1"]
excel = ["openpyxl>=3.0"]

[project.urls]
Repository = "https://github.com/LeoSanta15/pccpy"
Homepage = "https://github.com/LeoSanta15/pccpy"
Issues = "https://github.com/LeoSanta15/pccpy/issues"
Changelog = "https://github.com/LeoSanta15/pccpy/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pccpy = ["py.typed", "locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py39"
