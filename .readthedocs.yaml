# Configuración de Read the Docs (https://readthedocs.org).
# Para activarla: conecta el repositorio en readthedocs.org una vez esté en GitHub;
# no requiere ningún paso adicional, Read the Docs detecta este archivo solo.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Documentación en inglés: crear en Read the Docs un segundo proyecto «pccpy-en», añadirlo como traducción (idioma English)
# del proyecto principal y apuntarlo a este mismo repositorio; docs/source/conf.py lee el idioma de READTHEDOCS_LANGUAGE.
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
