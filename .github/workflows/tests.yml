name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pruebas (con cobertura)
        run: pytest --cov=pccpy --cov-report=term-missing

  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check src/
      - name: mypy
        run: mypy src/pccpy
      - name: Catálogos de traducción
        run: python scripts/i18n_check.py

  documentacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Construir en español (advertencias como errores)
        run: sphinx-build -b html -W docs/source docs/build
      - name: Construir en inglés (advertencias como errores)
        run: sphinx-build -b html -W -D language=en docs/source docs/build/en
      - name: Comprobar los catálogos de la documentación
        run: python scripts/docs_i18n_check.py
