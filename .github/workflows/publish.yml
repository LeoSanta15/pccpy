name: Publicar en PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # necesario para Trusted Publisher (OIDC)

jobs:
  build:
    name: Construir distribución
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar build
        run: pip install build

      - name: Construir wheel y sdist
        run: python -m build

      - name: Verificar artefactos
        run: ls -lh dist/

      - name: Guardar artefactos
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publicar en PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pccpy/
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Descargar artefactos
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Sin tokens: usa Trusted Publisher (OIDC) configurado en pypi.org
